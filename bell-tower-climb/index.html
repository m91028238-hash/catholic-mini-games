<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bell Tower Climb</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#1c1828;overflow:hidden;touch-action:none;font-family:Georgia,serif}
#wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#2a2438;max-width:100%;max-height:100%;touch-action:none}
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2}
#panel{pointer-events:auto;background:rgba(20,16,32,.94);border:1px solid #c9a86c;border-radius:16px;padding:28px 24px;width:min(300px,90vw);text-align:center;color:#f5e6c8}
#panel h1{font-size:1.3rem;color:#ffd98a;margin-bottom:8px}
#panel p{font-size:.85rem;line-height:1.45;margin-bottom:16px;opacity:.9}
#panel button{display:block;width:100%;margin:8px 0;padding:12px;border:none;border-radius:10px;background:#c9a86c;color:#1c1828;font:600 1rem Georgia,serif;cursor:pointer}
#panel button.sec{background:transparent;border:1px solid #c9a86c;color:#f5e6c8}
#mute{position:fixed;top:10px;right:10px;z-index:3;width:40px;height:40px;border-radius:50%;border:1px solid #c9a86c;background:rgba(20,16,32,.8);color:#f5e6c8;font-size:1.1rem;cursor:pointer}
#hud{position:fixed;top:12px;left:12px;z-index:3;color:#f5e6c8;font-size:.85rem;text-shadow:0 1px 3px #000;pointer-events:none}
</style></head><body>
<button id="mute" aria-label="Mute">🔊</button>
<div id="hud"></div>
<div id="ui"><div id="panel"></div></div>
<div id="wrap"><canvas id="c" width="360" height="780"></canvas></div>
<script>
const W=360,H=780,KEY='bellBest',cv=document.getElementById('c'),ctx=cv.getContext('2d');
const ui=document.getElementById('ui'),panel=document.getElementById('panel'),hud=document.getElementById('hud'),muteBtn=document.getElementById('mute');
let muted=localStorage.getItem('cmgMute')==='1',AC,state='menu',score=0,best=+localStorage.getItem(KEY)||0;
let px=W/2,py=H*.7,vx=0,vy=0,plats=[],bats=[],cam=0,level=1,bellY=0,maxH=0,t=0,keys={};
muteBtn.textContent=muted?'🔇':'🔊';
muteBtn.onclick=()=>{muted=!muted;localStorage.setItem('cmgMute',muted?'1':'0');muteBtn.textContent=muted?'🔇':'🔊'};
function beep(f,d,type='sine',v=.08){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
function show(html){panel.innerHTML=html;ui.style.display='flex'}
function hide(){ui.style.display='none'}
function startScreen(){state='menu';show(`<h1>Bell Tower Climb</h1><p>An altar server climbs to the bell. Drag or tap left/right halves (← →). Bounce on beams &amp; ladders. Avoid bats &amp; loose beams. Ring the bell to climb a taller tower.</p><button id="go">Climb</button>`);document.getElementById('go').onclick=start}
function gameOver(){state='over';best=Math.max(best,score);localStorage.setItem(KEY,best);beep(180,.35,'triangle');show(`<h1>Fallen</h1><p>Score: ${score}<br>Best: ${best}<br>Tower ${level}</p><button id="again">Play again</button><button class="sec" id="back">Back to menu</button>`);document.getElementById('again').onclick=start;document.getElementById('back').onclick=()=>location.href='../'}
function buildTower(){plats=[];bats=[];const h=900+level*200;bellY=-h;plats.push({x:W/2-40,y:H-40,w:80,type:'beam'});let y=H-120;while(y>bellY+60){const w=50+Math.random()*50,x=20+Math.random()*(W-w-40);const type=Math.random()<.15?'loose':Math.random()<.25?'ladder':'beam';plats.push({x,y,w,type});if(Math.random()<.2)bats.push({x:x+w/2,y:y-30,vx:1+Math.random(),phase:Math.random()*6});y-=55+Math.random()*35*(1+level*.05)}}
function start(){hide();state='play';if(level===1)score=0;px=W/2;py=H*.65;vx=0;vy=-8;cam=0;maxH=0;t=0;buildTower();beep(500,.1)}
function update(){if(state!=='play')return;t++;
if(keys.left)vx-=.35;if(keys.right)vx+=.35;vx*=.92;vx=Math.max(-5,Math.min(5,vx));vy+=.28;px+=vx;py+=vy;
if(px<10)px=10;if(px>W-10)px=W-10;
const sy=py-cam;
if(sy<H*.35)cam=py-H*.35;
plats.forEach(p=>{if(vy>0&&px>p.x-6&&px<p.x+p.w+6){const top=p.y;if(py>=top-8&&py<=top+14&&py-vy<=top+2){if(p.type==='loose'){vy=-9;p.y+=400;beep(200,.08,'sawtooth')}else{vy=p.type==='ladder'?-12:-11;beep(420,.05)}}}});
bats.forEach(b=>{b.x+=b.vx;if(b.x<20||b.x>W-20)b.vx*=-1;b.phase+=.08;if(Math.hypot(px-b.x,py-(b.y+Math.sin(b.phase)*8))<22){vy=2;vx+=(px<b.x?-3:3);beep(160,.1,'square');score=Math.max(0,score-5)}});
const height=Math.max(0,Math.floor((H*.7-py)/10));if(height>maxH){score+=height-maxH;maxH=height}
if(py<bellY+40){score+=100*level;beep(660,.1);beep(880,.15);setTimeout(()=>beep(520,.2),100);level++;state='bell';show(`<h1>Bell Rings!</h1><p>Tower ${level-1} complete.<br>Score: ${score}</p><button id="next">Next tower</button>`);document.getElementById('next').onclick=()=>{hide();start()};return}
if(py-cam>H+40)gameOver();
hud.textContent=`Score ${score} · Best ${best} · Tower ${level}`}
function draw(){ctx.clearRect(0,0,W,H);
const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a2240');g.addColorStop(1,'#3a2a28');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#4a3a30';ctx.fillRect(0,0,28,H);ctx.fillRect(W-28,0,28,H);
plats.forEach(p=>{const dy=p.y-cam;if(dy<-20||dy>H+20)return;ctx.fillStyle=p.type==='loose'?'#8a6a40':p.type==='ladder'?'#6a5a40':'#5a4030';ctx.fillRect(p.x,dy,p.w,10);if(p.type==='ladder'){ctx.strokeStyle='#8a7a50';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x+8,dy);ctx.lineTo(p.x+8,dy-40);ctx.moveTo(p.x+p.w-8,dy);ctx.lineTo(p.x+p.w-8,dy-40);for(let i=0;i<3;i++){ctx.moveTo(p.x+8,dy-10-i*12);ctx.lineTo(p.x+p.w-8,dy-10-i*12)}ctx.stroke()}});
const by=bellY-cam;if(by>-80&&by<H){ctx.fillStyle='#c9a86c';ctx.beginPath();ctx.arc(W/2,by,22,0,6.28);ctx.fill();ctx.fillStyle='#a08040';ctx.fillRect(W/2-4,by-40,8,22);ctx.fillStyle='#fff8e0';ctx.font='20px Georgia';ctx.textAlign='center';ctx.fillText('🔔',W/2,by+6)}
bats.forEach(b=>{const dy=b.y+Math.sin(b.phase)*8-cam;ctx.fillStyle='#2a2030';ctx.beginPath();ctx.ellipse(b.x,dy,12,6,0,0,6.28);ctx.fill();ctx.beginPath();ctx.moveTo(b.x-12,dy);ctx.quadraticCurveTo(b.x-20,dy-10+Math.sin(b.phase*2)*4,b.x-6,dy);ctx.moveTo(b.x+12,dy);ctx.quadraticCurveTo(b.x+20,dy-10+Math.sin(b.phase*2)*4,b.x+6,dy);ctx.fill()});
const dy=py-cam;ctx.fillStyle='#3a2a50';ctx.fillRect(px-10,dy-8,20,26);ctx.fillStyle='#e8d8c0';ctx.fillRect(px-12,dy-4,8,14);ctx.fillStyle='#f0d8b0';ctx.beginPath();ctx.arc(px,dy-14,8,0,6.28);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(px-3,dy-28,6,10)}
function loop(){update();draw();requestAnimationFrame(loop)}
function setSide(cx){const r=cv.getBoundingClientRect();keys.left=(cx-r.left)<r.width/2;keys.right=!keys.left}
cv.addEventListener('pointerdown',e=>{setSide(e.clientX);cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(e.buttons)setSide(e.clientX)});
cv.addEventListener('pointerup',()=>{keys.left=keys.right=false});
window.addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true});
window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false});
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();startScreen();loop();
</script></body></html>
