<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bell Tower Climb</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Serif+4:wght@400;500;600&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#1c1828;overflow:hidden;touch-action:none;font-family:Georgia,serif}
#wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#2a2438;max-width:100%;max-height:100%;touch-action:none}
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2}
#panel{pointer-events:auto;background:rgba(20,16,32,.94);border:1px solid #c9a86c;border-radius:16px;padding:28px 24px;width:min(300px,90vw);text-align:center;color:#f5e6c8}
#panel h1{font-size:1.3rem;color:#ffd98a;margin-bottom:8px}
#panel p{font-size:.85rem;line-height:1.45;margin-bottom:16px;opacity:.9}
#panel button{display:block;width:100%;margin:8px 0;padding:12px;border:none;border-radius:10px;background:#c9a86c;color:#1c1828;font:600 1rem Georgia,serif;cursor:pointer}
#panel button.sec{background:transparent;border:1px solid #c9a86c;color:#f5e6c8}
#mute{position:fixed;top:10px;right:10px;z-index:3;width:40px;height:40px;border-radius:50%;border:1px solid #c9a86c;background:rgba(20,16,32,.8);color:#f5e6c8;font-size:1.1rem;cursor:pointer}
#hud{position:fixed;top:12px;left:12px;z-index:3;color:#f5e6c8;font-size:.85rem;text-shadow:0 1px 3px #000;pointer-events:none}
#banner{position:fixed;top:42%;left:0;right:0;z-index:4;text-align:center;font:600 1.4rem Georgia,serif;color:#ffd98a;text-shadow:0 2px 8px #000;pointer-events:none;opacity:0;transition:opacity .2s}

/* refined theme */
html,body{background:#1a1612}
#panel{background:rgba(26,22,18,.95);border:1px solid rgba(210,180,108,.55);border-radius:3px;box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 0 0 4px #1a1612,inset 0 0 0 5px rgba(210,180,108,.2);color:#f4ead8;font-family:'Source Serif 4',Georgia,serif;padding:32px 26px}
#panel h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:2rem;letter-spacing:.02em;line-height:1.1;color:#e4c36a;background:linear-gradient(180deg,#e4c36a,#d2b46c 45%,#c9a24a 70%,#a8873f);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#panel h1::after{content:'';display:block;width:64px;height:1px;margin:12px auto 4px;background:linear-gradient(90deg,transparent,#d2b46c,transparent)}
#panel p{color:#f3ece0;opacity:.82}
#panel button{border:none;border-radius:2px;background:linear-gradient(180deg,#e4c36a,#c9a24a 60%,#a8873f);color:#1a1612;font:600 .9rem 'Source Serif 4',Georgia,serif;letter-spacing:.08em;text-transform:uppercase;padding:13px}
#panel button.sec{background:transparent;border:1px solid #a8873f;color:#f4ead8}
#mute{border-color:rgba(210,180,108,.6);background:rgba(26,22,18,.85);color:#e4c36a}
#hud{font-family:'Source Serif 4',Georgia,serif;color:#f4ead8;letter-spacing:.03em}
#banner{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.8rem;color:#e4c36a}
</style><script defer src="https://cloud.umami.is/script.js" data-website-id="15ec783e-8882-42d9-b43b-fefd064bbe24"></script>
</head><body>
<button id="mute" aria-label="Mute">🔊</button>
<div id="hud"></div><div id="banner"></div>
<div id="ui"><div id="panel"></div></div>
<div id="wrap"><canvas id="c" width="360" height="780"></canvas></div>
<script>
const W=360,H=780,KEY='bellBest',LKEY='bellLvl',cv=document.getElementById('c'),ctx=cv.getContext('2d');
const ui=document.getElementById('ui'),panel=document.getElementById('panel'),hud=document.getElementById('hud'),muteBtn=document.getElementById('mute'),banEl=document.getElementById('banner');
let muted=localStorage.getItem('cmgMute')==='1',AC,state='menu',score=0,best=+localStorage.getItem(KEY)||0,maxLvl=+localStorage.getItem(LKEY)||0;
let px=W/2,py=H*.7,vx=0,vy=0,plats=[],bats=[],cam=0,level=1,bellY=0,maxH=0,t=0,keys={},bannerT=0;
muteBtn.textContent=muted?'🔇':'🔊';
muteBtn.onclick=()=>{muted=!muted;localStorage.setItem('cmgMute',muted?'1':'0');muteBtn.textContent=muted?'🔇':'🔊'};
function beep(f,d,type='sine',v=.08){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
function show(html){panel.innerHTML=html;ui.style.display='flex'}
function hide(){ui.style.display='none'}
function flashBanner(txt){banEl.textContent=txt;banEl.style.opacity='1';bannerT=70}
/* towerH, gap, looseRate, batRate, grav, owl@4, moving@8, narrow@12 */
const LT={1:{h:900,gap:60,lr:.12,br:.15,g:.28},2:{h:1000,gap:58,lr:.14,br:.18,g:.29},3:{h:1100,gap:56,lr:.16,br:.2,g:.3},
4:{h:1200,gap:54,lr:.18,br:.22,g:.3},5:{h:1300,gap:52,lr:.2,br:.24,g:.31},6:{h:1400,gap:50,lr:.22,br:.26,g:.32},
7:{h:1500,gap:48,lr:.24,br:.28,g:.32},8:{h:1600,gap:46,lr:.26,br:.3,g:.33},9:{h:1700,gap:45,lr:.28,br:.32,g:.34},
10:{h:1800,gap:44,lr:.3,br:.34,g:.34},11:{h:1900,gap:43,lr:.32,br:.35,g:.35},12:{h:2000,gap:42,lr:.34,br:.36,g:.35},
13:{h:2100,gap:41,lr:.35,br:.38,g:.36},14:{h:2200,gap:40,lr:.36,br:.4,g:.36},15:{h:2300,gap:39,lr:.38,br:.4,g:.37},
16:{h:2400,gap:38,lr:.38,br:.42,g:.37},17:{h:2500,gap:38,lr:.4,br:.42,g:.38},18:{h:2600,gap:37,lr:.4,br:.44,g:.38},
19:{h:2700,gap:37,lr:.42,br:.44,g:.39},20:{h:2800,gap:36,lr:.42,br:.45,g:.4}};
function L(n){return LT[Math.min(20,Math.max(1,n))]||LT[20]}
function startScreen(){state='menu';show(`<h1>Bell Tower Climb</h1><p>An altar server climbs to the bell. Drag or tap left/right halves (← →). Bounce on beams &amp; ladders. Avoid bats &amp; loose beams. Ring the bell for the next level.</p><button id="go">Climb</button>`);document.getElementById('go').onclick=()=>{level=1;score=0;start()}}
function gameOver(){state='over';best=Math.max(best,score);maxLvl=Math.max(maxLvl,level);localStorage.setItem(KEY,best);localStorage.setItem(LKEY,maxLvl);beep(180,.35,'triangle');show(`<h1>Fallen</h1><p>Score: ${score}<br>Best: ${best}<br>Level ${level}</p><button id="again">Play again</button><button class="sec" id="back">Back to menu</button>`);document.getElementById('again').onclick=()=>{level=1;score=0;start()};document.getElementById('back').onclick=()=>location.href='../'}
function buildTower(){plats=[];bats=[];const cfg=L(level);bellY=-cfg.h;plats.push({x:W/2-40,y:H-40,w:80,type:'beam'});let y=H-120;
while(y>bellY+60){let w=50+Math.random()*50;if(level>=12)w=35+Math.random()*35;const x=20+Math.random()*(W-w-40);
let type=Math.random()<cfg.lr?'loose':Math.random()<.25?'ladder':'beam';if(level>=8&&Math.random()<.2)type='moving';
plats.push({x,y,w,type,ox:x,ph:Math.random()*6});if(Math.random()<cfg.br)bats.push({x:x+w/2,y:y-30,vx:1+Math.random()+level*.05,phase:Math.random()*6,kind:level>=4&&Math.random()<.3?'owl':'bat'});
y-=cfg.gap+Math.random()*20}}
function start(){hide();state='play';px=W/2;py=H*.65;vx=0;vy=-8;cam=0;maxH=0;t=0;buildTower();flashBanner('Level '+level);beep(500,.1)}
function update(){if(bannerT>0){bannerT--;if(bannerT===0)banEl.style.opacity='0'}
if(state!=='play')return;t++;const cfg=L(level);
if(keys.left)vx-=.35;if(keys.right)vx+=.35;vx*=.92;vx=Math.max(-5,Math.min(5,vx));vy+=cfg.g;px+=vx;py+=vy;
if(px<10)px=10;if(px>W-10)px=W-10;
if(py-cam<H*.35)cam=py-H*.35;
plats.forEach(p=>{if(p.type==='moving'){p.ph+=.04;p.x=p.ox+Math.sin(p.ph)*40}
if(vy>0&&px>p.x-6&&px<p.x+p.w+6){const top=p.y;if(py>=top-8&&py<=top+14&&py-vy<=top+2){if(p.type==='loose'){vy=-9;p.y+=400;beep(200,.08,'sawtooth')}else{vy=p.type==='ladder'?-12:-11;beep(420,.05)}}}});
bats.forEach(b=>{b.x+=b.vx;if(b.x<20||b.x>W-20)b.vx*=-1;b.phase+=.08;const by=b.y+Math.sin(b.phase)*8;if(Math.hypot(px-b.x,py-by)<(b.kind==='owl'?28:22)){vy=2;vx+=(px<b.x?-3:3);beep(160,.1,'square');score=Math.max(0,score-(b.kind==='owl'?10:5))}});
const height=Math.max(0,Math.floor((H*.7-py)/10));if(height>maxH){score+=height-maxH;maxH=height}
if(py<bellY+40){score+=100*level;beep(660,.1);beep(880,.15);setTimeout(()=>beep(520,.2),100);maxLvl=Math.max(maxLvl,level);level++;state='bell';
show(`<h1>Bell Rings!</h1><p>Level ${level-1} complete.<br>Score: ${score}</p><button id="next">Level ${level}</button>`);document.getElementById('next').onclick=()=>{hide();start()};return}
if(py-cam>H+40)gameOver();
hud.textContent=`Score ${score} · Best ${best} · Level ${level}`}
function draw(){ctx.clearRect(0,0,W,H);
const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a2240');g.addColorStop(1,'#3a2a28');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#4a3a30';ctx.fillRect(0,0,28,H);ctx.fillRect(W-28,0,28,H);
plats.forEach(p=>{const dy=p.y-cam;if(dy<-20||dy>H+20)return;ctx.fillStyle=p.type==='loose'?'#8a6a40':p.type==='ladder'?'#6a5a40':p.type==='moving'?'#7a6040':'#5a4030';ctx.fillRect(p.x,dy,p.w,10);if(p.type==='ladder'){ctx.strokeStyle='#8a7a50';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x+8,dy);ctx.lineTo(p.x+8,dy-40);ctx.moveTo(p.x+p.w-8,dy);ctx.lineTo(p.x+p.w-8,dy-40);for(let i=0;i<3;i++){ctx.moveTo(p.x+8,dy-10-i*12);ctx.lineTo(p.x+p.w-8,dy-10-i*12)}ctx.stroke()}});
const by=bellY-cam;if(by>-80&&by<H){ctx.fillStyle='#c9a86c';ctx.beginPath();ctx.arc(W/2,by,22,0,6.28);ctx.fill();ctx.fillStyle='#a08040';ctx.fillRect(W/2-4,by-40,8,22);ctx.fillStyle='#fff8e0';ctx.font='20px Georgia';ctx.textAlign='center';ctx.fillText('🔔',W/2,by+6)}
bats.forEach(b=>{const dy=b.y+Math.sin(b.phase)*8-cam;ctx.fillStyle=b.kind==='owl'?'#4a3a28':'#2a2030';ctx.beginPath();ctx.ellipse(b.x,dy,b.kind==='owl'?16:12,b.kind==='owl'?10:6,0,0,6.28);ctx.fill();ctx.beginPath();ctx.moveTo(b.x-12,dy);ctx.quadraticCurveTo(b.x-20,dy-10+Math.sin(b.phase*2)*4,b.x-6,dy);ctx.moveTo(b.x+12,dy);ctx.quadraticCurveTo(b.x+20,dy-10+Math.sin(b.phase*2)*4,b.x+6,dy);ctx.fill()});
const dy=py-cam;ctx.fillStyle='#3a2a50';ctx.fillRect(px-10,dy-8,20,26);ctx.fillStyle='#e8d8c0';ctx.fillRect(px-12,dy-4,8,14);ctx.fillStyle='#f0d8b0';ctx.beginPath();ctx.arc(px,dy-14,8,0,6.28);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(px-3,dy-28,6,10)}
function loop(){update();draw();requestAnimationFrame(loop)}
function setSide(cx){const r=cv.getBoundingClientRect();keys.left=(cx-r.left)<r.width/2;keys.right=!keys.left}
cv.addEventListener('pointerdown',e=>{setSide(e.clientX);cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(e.buttons)setSide(e.clientX)});
cv.addEventListener('pointerup',()=>{keys.left=keys.right=false});
window.addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true});
window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false});
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();window.__cmgTest={getLevel:()=>level,getState:()=>state,advance:()=>{if(state==='menu'){level=1;score=0;start()}else{level++;start()}},L};startScreen();loop();
</script></body></html>
