<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ark Flight</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#1a2838;overflow:hidden;touch-action:none;font-family:Georgia,serif}
#wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;max-width:100%;max-height:100%;touch-action:none}
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2}
#panel{pointer-events:auto;background:rgba(16,28,40,.94);border:1px solid #c9a86c;border-radius:16px;padding:28px 24px;width:min(300px,90vw);text-align:center;color:#f5e6c8}
#panel h1{font-size:1.3rem;color:#ffd98a;margin-bottom:8px}
#panel p{font-size:.85rem;line-height:1.45;margin-bottom:16px;opacity:.9}
#panel button{display:block;width:100%;margin:8px 0;padding:12px;border:none;border-radius:10px;background:#c9a86c;color:#1a2838;font:600 1rem Georgia,serif;cursor:pointer}
#panel button.sec{background:transparent;border:1px solid #c9a86c;color:#f5e6c8}
#mute{position:fixed;top:10px;right:10px;z-index:3;width:40px;height:40px;border-radius:50%;border:1px solid #c9a86c;background:rgba(16,28,40,.8);color:#f5e6c8;font-size:1.1rem;cursor:pointer}
#hud{position:fixed;top:12px;left:12px;z-index:3;color:#f5e6c8;font-size:.85rem;text-shadow:0 1px 3px #000;pointer-events:none}
#banner{position:fixed;top:42%;left:0;right:0;z-index:4;text-align:center;font:600 1.4rem Georgia,serif;color:#ffd98a;text-shadow:0 2px 8px #000;pointer-events:none;opacity:0;transition:opacity .2s}
</style></head><body>
<button id="mute" aria-label="Mute">🔊</button>
<div id="hud"></div><div id="banner"></div>
<div id="ui"><div id="panel"></div></div>
<div id="wrap"><canvas id="c"></canvas></div>
<script type="module">
import*as THREE from'../vendor/three.module.min.js';
const W=360,H=780,KEY='arkBest',LKEY='arkLvl';
const cv=document.getElementById('c'),ui=document.getElementById('ui'),panel=document.getElementById('panel');
const hud=document.getElementById('hud'),muteBtn=document.getElementById('mute'),banEl=document.getElementById('banner');
let muted=localStorage.getItem('cmgMute')==='1',AC,state='menu',score=0,best=+localStorage.getItem(KEY)||0;
let maxLvl=+localStorage.getItem(LKEY)||0,level=1,bannerT=0,feathers=3,olives=0,t=0,rainbowT=0;
muteBtn.textContent=muted?'🔇':'🔊';
muteBtn.onclick=()=>{muted=!muted;localStorage.setItem('cmgMute',muted?'1':'0');muteBtn.textContent=muted?'🔇':'🔊'};
function beep(f,d,type='sine',v=.08){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
function show(html){panel.innerHTML=html;ui.style.display='flex'}
function hide(){ui.style.display='none'}
function flashBanner(txt){banEl.textContent=txt;banEl.style.opacity='1';bannerT=70}
/* level -> speed, ringGap, cloudRate, logRate, oliveRate, ringR */
const LT={1:{sp:0.18,rg:90,cr:0,lr:0.008,or:0.002,rr:1.1},2:{sp:0.2,rg:85,cr:0.004,lr:0.01,or:0.002,rr:1.05},
3:{sp:0.22,rg:80,cr:0.006,lr:0.012,or:0.003,rr:1},4:{sp:0.24,rg:75,cr:0.008,lr:0.014,or:0.003,rr:.95},
5:{sp:0.26,rg:70,cr:0.01,lr:0.016,or:0.003,rr:.92},6:{sp:0.28,rg:66,cr:0.012,lr:0.018,or:0.004,rr:.9},
7:{sp:0.3,rg:62,cr:0.014,lr:0.02,or:0.004,rr:.88},8:{sp:0.32,rg:58,cr:0.016,lr:0.022,or:0.004,rr:.86},
9:{sp:0.34,rg:55,cr:0.018,lr:0.024,or:0.005,rr:.84},10:{sp:0.36,rg:52,cr:0.02,lr:0.026,or:0.005,rr:.82},
11:{sp:0.38,rg:50,cr:0.022,lr:0.028,or:0.005,rr:.8},12:{sp:0.4,rg:48,cr:0.024,lr:0.03,or:0.006,rr:.78},
13:{sp:0.42,rg:46,cr:0.026,lr:0.032,or:0.006,rr:.76},14:{sp:0.44,rg:44,cr:0.028,lr:0.034,or:0.006,rr:.74},
15:{sp:0.46,rg:42,cr:0.03,lr:0.036,or:0.007,rr:.72},16:{sp:0.48,rg:40,cr:0.032,lr:0.038,or:0.007,rr:.7},
17:{sp:0.5,rg:38,cr:0.034,lr:0.04,or:0.007,rr:.68},18:{sp:0.52,rg:36,cr:0.036,lr:0.042,or:0.008,rr:.66},
19:{sp:0.54,rg:35,cr:0.038,lr:0.044,or:0.008,rr:.64},20:{sp:0.56,rg:34,cr:0.04,lr:0.046,or:0.008,rr:.62}};
function L(n){return LT[Math.min(20,Math.max(1,n))]||LT[20]}
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(W,H,false);
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x3a5068,8,42);
const cam=new THREE.PerspectiveCamera(55,W/H,.1,60);cam.position.set(0,2.2,5);
const hemi=new THREE.HemisphereLight(0x8899aa,0x1a3040,.9);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xc0d0e0,.5);sun.position.set(2,8,3);scene.add(sun);
const sea=new THREE.Mesh(new THREE.PlaneGeometry(80,80,1,1),new THREE.MeshLambertMaterial({color:0x2a6080}));
sea.rotation.x=-Math.PI/2;sea.position.y=-1.2;scene.add(sea);
const skyG=new THREE.Mesh(new THREE.SphereGeometry(50,12,8),new THREE.MeshBasicMaterial({color:0x4a6078,side:THREE.BackSide}));scene.add(skyG);
/* dove */
const dove=new THREE.Group();
const body=new THREE.Mesh(new THREE.SphereGeometry(.22,8,6),new THREE.MeshLambertMaterial({color:0xf5f5f0}));dove.add(body);
const wingL=new THREE.Mesh(new THREE.BoxGeometry(.5,.06,.22),new THREE.MeshLambertMaterial({color:0xe8e8e0}));wingL.position.set(-.28,0,0);dove.add(wingL);
const wingR=wingL.clone();wingR.position.x=.28;dove.add(wingR);
const head=new THREE.Mesh(new THREE.SphereGeometry(.12,6,5),new THREE.MeshLambertMaterial({color:0xffffff}));head.position.set(0,.08,-.22);dove.add(head);
dove.position.set(0,1.5,0);scene.add(dove);
let tx=0,ty=1.5,px=0,py=1.5,keys={},drag=false,lx=0,ly=0;
let rings=[],clouds=[],logs=[],branches=[],rain=[],ringCd=0;
const rainbow=new THREE.Group();rainbow.visible=false;
[0xe07070,0xe0a040,0xe0e060,0x60c060,0x60a0e0,0x8060c0].forEach((c,i)=>{
  const t=new THREE.Mesh(new THREE.TorusGeometry(3.2+i*.18,.06,6,24,Math.PI),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.55}));
  t.rotation.z=Math.PI;t.position.y=2;rainbow.add(t)});scene.add(rainbow);
function mkRing(z,x,y,r){const m=new THREE.Mesh(new THREE.TorusGeometry(r,.06,6,16),new THREE.MeshBasicMaterial({color:0xffe8a0,transparent:true,opacity:.85}));m.position.set(x,y,z);scene.add(m);return{mesh:m,x,y,z,r}}
function mkCloud(z,x,y){const g=new THREE.Group();const mat=new THREE.MeshLambertMaterial({color:0x3a3a48});
[[0,0,0,.5],[.4,.1,.1,.35],[-.35,.05,-.1,.4]].forEach(([a,b,c,s])=>{const p=new THREE.Mesh(new THREE.SphereGeometry(s,6,5),mat);p.position.set(a,b,c);g.add(p)});
g.position.set(x,y,z);scene.add(g);return{mesh:g,x,y,z,hit:.7}}
function mkLog(z,x,y){const m=new THREE.Mesh(new THREE.CylinderGeometry(.12,.14,.9,6),new THREE.MeshLambertMaterial({color:0x6a4a28}));m.rotation.z=Math.PI/2;m.position.set(x,y,z);scene.add(m);return{mesh:m,x,y,z,hit:.45}}
function mkOlive(z,x,y){const g=new THREE.Group();const stem=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,.35,4),new THREE.MeshLambertMaterial({color:0x5a8030}));g.add(stem);
const leaf=new THREE.Mesh(new THREE.SphereGeometry(.15,6,4),new THREE.MeshLambertMaterial({color:0x6a9a40}));leaf.scale.set(1,.3,1.4);leaf.position.y=.1;g.add(leaf);
g.position.set(x,y,z);scene.add(g);return{mesh:g,x,y,z,hit:.4}}
function clearWorld(){[rings,clouds,logs,branches].forEach(a=>a.forEach(o=>scene.remove(o.mesh)));rings=[];clouds=[];logs=[];branches=[];rain.forEach(r=>scene.remove(r));rain=[];rainbow.visible=false}
function startScreen(){state='menu';show(`<h1>Ark Flight</h1><p>Drag to steer the dove (or WASD / arrows). Fly through rings of light. Avoid storm clouds and logs. Collect 3 olive branches for a rainbow and the next level.</p><button id="go">Fly</button>`);document.getElementById('go').onclick=start}
function gameOver(){state='over';best=Math.max(best,score);maxLvl=Math.max(maxLvl,level);localStorage.setItem(KEY,best);localStorage.setItem(LKEY,maxLvl);beep(180,.35,'triangle');
show(`<h1>Wings Fold</h1><p>Score: ${score}<br>Best: ${best}<br>Level ${level}</p><button id="again">Play again</button><button class="sec" id="back">Back to menu</button>`);
document.getElementById('again').onclick=start;document.getElementById('back').onclick=()=>location.href='../'}
function start(){hide();clearWorld();state='play';score=0;level=1;feathers=3;olives=0;t=0;rainbowT=0;ringCd=0;px=tx=0;py=ty=1.5;dove.position.set(0,1.5,0);beep(520,.1);flashBanner('Level 1');
for(let i=0;i<40;i++){const d=new THREE.Mesh(new THREE.BoxGeometry(.02,.25,.02),new THREE.MeshBasicMaterial({color:0xa0b8c8,transparent:true,opacity:.35}));d.position.set((Math.random()-5)*8,Math.random()*6,-Math.random()*30);scene.add(d);rain.push(d)}}
function hit(o,pad){return Math.hypot(px-o.x,py-o.y)<(o.hit||o.r||.5)+pad&&Math.abs(o.z+2)<1.2}
function advanceLevel(){level++;olives=0;maxLvl=Math.max(maxLvl,level);score+=50*level;rainbowT=100;rainbow.visible=true;rainbow.position.set(0,1,-6);
flashBanner('Level '+level);beep(523,.1);setTimeout(()=>beep(659,.1),80);setTimeout(()=>beep(784,.2),160)}
function update(){
  if(bannerT>0){bannerT--;if(bannerT===0)banEl.style.opacity='0'}
  if(state!=='play')return;t++;const cfg=L(level);const sp=cfg.sp;
  if(rainbowT>0){rainbowT--;if(rainbowT===0)rainbow.visible=false}
  /* steer eased */
  if(keys.l)tx=Math.max(-2.8,tx-.06);if(keys.r)tx=Math.min(2.8,tx+.06);
  if(keys.u)ty=Math.min(3.5,ty+.05);if(keys.d)ty=Math.max(.3,ty-.05);
  px+=(tx-px)*.08;py+=(ty-py)*.08;dove.position.x=px;dove.position.y=py;
  dove.rotation.z=(tx-px)*.3;dove.rotation.x=(py-ty)*.15;
  wingL.rotation.z=Math.sin(t*.25)*.4;wingR.rotation.z=-Math.sin(t*.25)*.4;
  /* spawn */
  if(--ringCd<=0){ringCd=cfg.rg;rings.push(mkRing(-28,(Math.random()-.5)*4,.8+Math.random()*2.2,cfg.rr))}
  if(Math.random()<cfg.cr)clouds.push(mkCloud(-28,(Math.random()-.5)*5,.5+Math.random()*2.8));
  if(Math.random()<cfg.lr)logs.push(mkLog(-28,(Math.random()-.5)*4.5,-.6+Math.random()*.8));
  if(Math.random()<cfg.or)branches.push(mkOlive(-28,(Math.random()-.5)*3.5,1+Math.random()*2));
  function adv(arr,fn){return arr.filter(o=>{o.z+=sp;o.mesh.position.z=o.z;if(o.z>6){scene.remove(o.mesh);return false}fn&&fn(o);return true})}
  rings=adv(rings,o=>{if(hit(o,.15)){score+=15;beep(880,.06);scene.remove(o.mesh);o.z=99}});
  rings=rings.filter(o=>o.z<90);
  clouds=adv(clouds,o=>{if(hit(o,.2)){feathers--;beep(160,.12,'sawtooth');scene.remove(o.mesh);o.z=99;if(feathers<=0)gameOver()}});
  clouds=clouds.filter(o=>o.z<90);
  logs=adv(logs,o=>{if(hit(o,.15)){feathers--;beep(140,.12,'square');scene.remove(o.mesh);o.z=99;if(feathers<=0)gameOver()}});
  logs=logs.filter(o=>o.z<90);
  branches=adv(branches,o=>{if(hit(o,.2)){olives++;score+=40;beep(660,.1);scene.remove(o.mesh);o.z=99;if(olives>=3)advanceLevel()}});
  branches=branches.filter(o=>o.z<90);
  rain.forEach((d,i)=>{d.position.z+=sp*1.5;d.position.y-=.15;if(d.position.y<-1||d.position.z>5){d.position.set((Math.random()-.5)*10,4+Math.random()*3,-5-Math.random()*25)}});
  sea.position.z=(sea.position.z+sp*.5)%4;
  score+=1;hud.textContent=`Score ${score} · Best ${best} · Level ${level} · ❤${feathers} · 🌿${olives}/3`;
}
function loop(){update();renderer.render(scene,cam);requestAnimationFrame(loop)}
function setSteer(cx,cy){const r=cv.getBoundingClientRect();tx=(cx-r.left)/r.width*5.6-2.8;ty=3.5-(cy-r.top)/r.height*3.2;tx=Math.max(-2.8,Math.min(2.8,tx));ty=Math.max(.3,Math.min(3.5,ty))}
cv.addEventListener('pointerdown',e=>{drag=true;setSteer(e.clientX,e.clientY);cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(drag)setSteer(e.clientX,e.clientY)});
cv.addEventListener('pointerup',()=>drag=false);
window.addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=1;if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=1;if(e.code==='ArrowUp'||e.code==='KeyW')keys.u=1;if(e.code==='ArrowDown'||e.code==='KeyS')keys.d=1});
window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=0;if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=0;if(e.code==='ArrowUp'||e.code==='KeyW')keys.u=0;if(e.code==='ArrowDown'||e.code==='KeyS')keys.d=0});
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();
window.__cmgTest={getLevel:()=>level,getState:()=>state,advance:()=>{if(state==='menu')start();else if(state==='play'){olives=2;branches.push(mkOlive(-1,px,py));}},L};
startScreen();loop();
</script></body></html>
