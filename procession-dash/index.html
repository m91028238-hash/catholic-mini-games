<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Procession Dash</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Serif+4:wght@400;500;600&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#1a2030;overflow:hidden;touch-action:none;font-family:Georgia,serif}
#wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#2a3548;max-width:100%;max-height:100%;touch-action:none}
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2}
#panel{pointer-events:auto;background:rgba(15,20,35,.92);border:1px solid #c9a86c;border-radius:16px;padding:28px 24px;width:min(300px,90vw);text-align:center;color:#f5e6c8}
#panel h1{font-size:1.3rem;color:#ffd98a;margin-bottom:8px}
#panel p{font-size:.85rem;line-height:1.45;margin-bottom:16px;opacity:.9}
#panel button{display:block;width:100%;margin:8px 0;padding:12px;border:none;border-radius:10px;background:#c9a86c;color:#1a2030;font:600 1rem Georgia,serif;cursor:pointer}
#panel button.sec{background:transparent;border:1px solid #c9a86c;color:#f5e6c8}
#mute{position:fixed;top:10px;right:10px;z-index:3;width:40px;height:40px;border-radius:50%;border:1px solid #c9a86c;background:rgba(15,20,35,.8);color:#f5e6c8;font-size:1.1rem;cursor:pointer}
#hud{position:fixed;top:12px;left:12px;z-index:3;color:#f5e6c8;font-size:.85rem;text-shadow:0 1px 3px #000;pointer-events:none}
#banner{position:fixed;top:42%;left:0;right:0;z-index:4;text-align:center;font:600 1.4rem Georgia,serif;color:#ffd98a;text-shadow:0 2px 8px #000;pointer-events:none;opacity:0;transition:opacity .2s}

/* refined theme */
html,body{background:#1a1612}
#panel{background:rgba(26,22,18,.95);border:1px solid rgba(210,180,108,.55);border-radius:3px;box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 0 0 4px #1a1612,inset 0 0 0 5px rgba(210,180,108,.2);color:#f4ead8;font-family:'Source Serif 4',Georgia,serif;padding:32px 26px}
#panel h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:2rem;letter-spacing:.02em;line-height:1.1;color:#e4c36a;background:linear-gradient(180deg,#e4c36a,#d2b46c 45%,#c9a24a 70%,#a8873f);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#panel h1::after{content:'';display:block;width:64px;height:1px;margin:12px auto 4px;background:linear-gradient(90deg,transparent,#d2b46c,transparent)}
#panel p{color:#f3ece0;opacity:.82}
#panel button{border:none;border-radius:2px;background:linear-gradient(180deg,#e4c36a,#c9a24a 60%,#a8873f);color:#1a1612;font:600 .9rem 'Source Serif 4',Georgia,serif;letter-spacing:.08em;text-transform:uppercase;padding:13px}
#panel button.sec{background:transparent;border:1px solid #a8873f;color:#f4ead8}
#mute{border-color:rgba(210,180,108,.6);background:rgba(26,22,18,.85);color:#e4c36a}
#hud{font-family:'Source Serif 4',Georgia,serif;color:#f4ead8;letter-spacing:.03em}
#banner{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.8rem;color:#e4c36a}
</style><script defer src="https://cloud.umami.is/script.js" data-website-id="15ec783e-8882-42d9-b43b-fefd064bbe24"></script>
</head><body>
<button id="mute" aria-label="Mute">🔊</button>
<div id="hud"></div><div id="banner"></div>
<div id="ui"><div id="panel"></div></div>
<div id="wrap"><canvas id="c" width="360" height="780"></canvas></div>
<script>
const W=360,H=780,KEY='procBest',LKEY='procLvl',cv=document.getElementById('c'),ctx=cv.getContext('2d');
const ui=document.getElementById('ui'),panel=document.getElementById('panel'),hud=document.getElementById('hud'),muteBtn=document.getElementById('mute'),banEl=document.getElementById('banner');
let muted=localStorage.getItem('cmgMute')==='1',AC,state='menu',score=0,best=+localStorage.getItem(KEY)||0,maxLvl=+localStorage.getItem(LKEY)||0;
let px=W/2,followers=5,scroll=0,haz=[],pets=[],fol=[],t=0,dragging=false,level=1,bannerT=0,dist=0;
muteBtn.textContent=muted?'🔇':'🔊';
muteBtn.onclick=()=>{muted=!muted;localStorage.setItem('cmgMute',muted?'1':'0');muteBtn.textContent=muted?'🔇':'🔊'};
function beep(f,d,type='sine',v=.08){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
function show(html){panel.innerHTML=html;ui.style.display='flex'}
function hide(){ui.style.display='none'}
function flashBanner(txt){banEl.textContent=txt;banEl.style.opacity='1';bannerT=70}
const LT={1:{sp:2.0,sg:58,pc:.3,fc:.22},2:{sp:2.2,sg:54,pc:.28,fc:.2},3:{sp:2.4,sg:50,pc:.26,fc:.18},4:{sp:2.6,sg:46,pc:.24,fc:.16},
5:{sp:2.8,sg:44,pc:.22,fc:.15},6:{sp:3.0,sg:42,pc:.2,fc:.14},7:{sp:3.2,sg:40,pc:.18,fc:.13},8:{sp:3.4,sg:38,pc:.16,fc:.12},
9:{sp:3.6,sg:36,pc:.15,fc:.11},10:{sp:3.8,sg:34,pc:.14,fc:.1},11:{sp:4.0,sg:32,pc:.13,fc:.1},12:{sp:4.2,sg:30,pc:.12,fc:.09},
13:{sp:4.4,sg:29,pc:.11,fc:.08},14:{sp:4.6,sg:28,pc:.1,fc:.08},15:{sp:4.8,sg:27,pc:.1,fc:.07},16:{sp:5.0,sg:26,pc:.09,fc:.07},
17:{sp:5.15,sg:25,pc:.08,fc:.06},18:{sp:5.3,sg:24,pc:.08,fc:.06},19:{sp:5.45,sg:23,pc:.07,fc:.05},20:{sp:5.6,sg:22,pc:.07,fc:.05}};
function L(n){return LT[Math.min(20,Math.max(1,n))]||LT[20]}
function startScreen(){state='menu';show(`<h1>Procession Dash</h1><p>Steer the Corpus Christi procession. Drag left/right or use ← →. Avoid puddles, carts &amp; stalls. Collect petals &amp; followers. Zero followers ends the journey.</p><button id="go">Begin</button>`);document.getElementById('go').onclick=start}
function gameOver(){state='over';best=Math.max(best,score);maxLvl=Math.max(maxLvl,level);localStorage.setItem(KEY,best);localStorage.setItem(LKEY,maxLvl);beep(200,.35,'triangle');show(`<h1>Procession Ends</h1><p>Score: ${score}<br>Best: ${best}<br>Level ${level}</p><button id="again">Play again</button><button class="sec" id="back">Back to menu</button>`);document.getElementById('again').onclick=start;document.getElementById('back').onclick=()=>location.href='../'}
function start(){hide();state='play';score=0;px=W/2;followers=5;scroll=0;haz=[];pets=[];fol=[];t=0;level=1;dist=0;flashBanner('Level 1');beep(500,.1)}
function spawn(){const cfg=L(level),r=Math.random(),x=40+Math.random()*(W-80);
if(r<cfg.pc)pets.push({x,y:-20});
else if(r<cfg.pc+cfg.fc)fol.push({x,y:-24});
else{let type=r<.4?'puddle':r<.7?'cart':'stall';if(level>=4&&r>.9)type='crowd';if(level>=8&&r>.82&&r<=.9)type='wagon';if(level>=12&&Math.random()<.35){haz.push({x,y:-40,w:40,h:30,type});haz.push({x:(x+80)%(W-80)+40,y:-90,w:36,h:28,type:'puddle'});return}
haz.push({x,y:-40,w:type==='wagon'?60:type==='crowd'?48:36,h:type==='wagon'?44:28,type})}}
function hit(a,b,pad=8){return Math.abs(a.x-b.x)<(a.w||20)/2+(b.w||16)/2-pad&&Math.abs(a.y-b.y)<(a.h||30)/2+(b.h||20)/2}
function levelUp(){level++;maxLvl=Math.max(maxLvl,level);flashBanner('Level '+level);beep(660,.1);score+=25}
function update(){if(bannerT>0){bannerT--;if(bannerT===0)banEl.style.opacity='0'}
if(state!=='play')return;t++;const cfg=L(level);scroll+=cfg.sp;dist+=cfg.sp;if(dist>450){dist=0;levelUp()}
if(t%Math.max(20,cfg.sg|0)===0)spawn();
haz.forEach(o=>o.y+=cfg.sp);pets.forEach(o=>o.y+=cfg.sp);fol.forEach(o=>o.y+=cfg.sp);
const me={x:px,y:H*.68,w:36,h:50};
haz=haz.filter(o=>{if(o.y>H+50)return false;if(hit(me,o,4)){followers=Math.max(0,followers-(o.type==='wagon'?2:1));score=Math.max(0,score-5);beep(180,.1,'sawtooth');return false}return true});
pets=pets.filter(o=>{if(o.y>H+30)return false;if(hit(me,{x:o.x,y:o.y,w:20,h:16},0)){score+=12;beep(720,.08);return false}return true});
fol=fol.filter(o=>{if(o.y>H+30)return false;if(hit(me,{x:o.x,y:o.y,w:22,h:28},0)){followers++;score+=20;beep(560,.1);return false}return true});
score+=1;if(followers<=0)gameOver();
hud.textContent=`Score ${score} · Best ${best} · Level ${level} · Followers ${followers}`}
function drawPerson(x,y,robe,small){const s=small?.7:1;ctx.fillStyle=robe;ctx.fillRect(x-10*s,y-5*s,20*s,28*s);ctx.fillStyle='#f0d8b0';ctx.beginPath();ctx.arc(x,y-12*s,8*s,0,6.28);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(x-2*s,y-38*s,4*s,18*s);ctx.fillStyle='#ffd98a';ctx.beginPath();ctx.moveTo(x,y-42*s);ctx.lineTo(x-5*s,y-34*s);ctx.lineTo(x+5*s,y-34*s);ctx.fill()}
function draw(){ctx.clearRect(0,0,W,H);
const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#6a9ac8');g.addColorStop(.35,'#8bb8d8');g.addColorStop(.35,'#7a8a5a');g.addColorStop(1,'#5a6a40');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#8a8070';ctx.fillRect(W*.15,0,W*.7,H);
for(let i=-1;i<16;i++){const py=((scroll+i*50)%(H+50))-25;ctx.fillStyle='#7a7060';ctx.fillRect(W*.15,py,W*.7,2)}
ctx.fillStyle='#5a8a4a';ctx.fillRect(0,0,W*.15,H);ctx.fillRect(W*.85,0,W*.15,H);
haz.forEach(o=>{if(o.type==='puddle'){ctx.fillStyle='rgba(80,140,200,.55)';ctx.beginPath();ctx.ellipse(o.x,o.y,o.w/2,o.h/3,0,0,6.28);ctx.fill()}
else if(o.type==='cart'||o.type==='wagon'){ctx.fillStyle=o.type==='wagon'?'#4a3020':'#6a4a30';ctx.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h);ctx.fillStyle='#333';ctx.beginPath();ctx.arc(o.x-12,o.y+o.h/2,7,0,6.28);ctx.arc(o.x+12,o.y+o.h/2,7,0,6.28);ctx.fill()}
else if(o.type==='crowd'){ctx.fillStyle='#5a4a60';ctx.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h)}
else{ctx.fillStyle='#c07050';ctx.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h);ctx.fillStyle='#a05030';ctx.fillRect(o.x-o.w/2-4,o.y-o.h/2-8,o.w+8,10)}});
pets.forEach(o=>{ctx.fillStyle='#e8a0c0';for(let i=0;i<4;i++){ctx.beginPath();ctx.ellipse(o.x-6+i*4,o.y,4,6,0,0,6.28);ctx.fill()}});
fol.forEach(o=>drawPerson(o.x,o.y,'#4a6a9a',true));
const by=H*.68;drawPerson(px,by,'#f5f0e8');
for(let i=0;i<Math.min(followers,8);i++){const fy=by+28+i*22;drawPerson(px+Math.sin(t*.05+i)*6,fy,i%2?'#d0c8e8':'#e8d8c0',true)}
ctx.fillStyle='#fff8e0';ctx.font='bold 18px Georgia';ctx.textAlign='center';ctx.fillText('✝',px,by-48)}
function loop(){update();draw();requestAnimationFrame(loop)}
function setX(clientX){const r=cv.getBoundingClientRect();px=Math.max(40,Math.min(W-40,(clientX-r.left)/r.width*W))}
cv.addEventListener('pointerdown',e=>{dragging=true;setX(e.clientX);cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(dragging)setX(e.clientX)});
cv.addEventListener('pointerup',()=>dragging=false);
window.addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')px=Math.max(40,px-18);if(e.code==='ArrowRight'||e.code==='KeyD')px=Math.min(W-40,px+18)});
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();window.__cmgTest={getLevel:()=>level,getState:()=>state,advance:()=>{if(state==='menu')start();else levelUp()},L};startScreen();loop();
</script></body></html>
